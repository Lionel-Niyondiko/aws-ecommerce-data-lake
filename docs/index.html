<!-- Theme and language are resolved BEFORE the first paint, from the same
     storage keys app.js uses. Kept inline, tiny and synchronous on purpose:
     an external file would arrive too late to prevent a flash of the wrong
     theme. It resolves initial state only; all interactive logic stays in
     app.js. The "js" class lets the stylesheet hide reveal-on-scroll content
     only when a script is there to reveal it. -->
<script>
(function () {
  var d = document.documentElement;
  d.className += " js";
  try {
    var storedTheme = localStorage.getItem("ecommerce-datalake-theme");
    var sysDark = window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = storedTheme || (sysDark ? "dark" : "light");
    d.setAttribute("data-theme", theme);
    d.style.colorScheme = theme;

    var storedLang = localStorage.getItem("ecommerce-datalake-language");
    if (storedLang === "fr" || storedLang === "en") {
      d.setAttribute("lang", storedLang);
    } else {
      var tags = (navigator.languages || [navigator.language || "en"]);
      var lang = "en";
      for (var i = 0; i < tags.length; i++) {
        var base = String(tags[i]).toLowerCase().split("-")[0];
        if (base === "fr" || base === "en") { lang = base; break; }
      }
      d.setAttribute("lang", lang);
    }
  } catch (e) {
    d.setAttribute("data-theme", "light");   /* private mode: light default */
  }
})();
</script>
