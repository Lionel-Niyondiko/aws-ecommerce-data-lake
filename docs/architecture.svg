<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 532" role="img" font-family="Inter Tight, Inter, Helvetica Neue, Arial, sans-serif">
<title>Target architecture — E-commerce Data Lake on AWS</title>
<desc>Terraform provisions the infrastructure. Three source files feed the bronze zone of a single Amazon S3 bucket, transformed by Athena CTAS into silver then gold, which answers the six business questions. Glue Data Catalog and Athena serve the whole bucket.</desc>

<!-- ===========================================================================
     Authored on white and tone-mapped for dark by style.css, so every colour
     here is a light-theme colour. Nothing in this file is language-specific
     except <desc>, which app.js copies into the caption under the plate.
     =========================================================================== -->

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#56534D"/>
  </marker>
  <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#E8431E"/>
  </marker>

  <!-- A source file. Two variants, because the badge is the only way to tell a
       delimited file from a JSON one at this size. -->
  <symbol id="ic-csv" viewBox="0 0 28 34">
    <path d="M3 1.2h12.4l9.4 9.4v21.2a1.6 1.6 0 0 1-1.6 1.6H3a1.6 1.6 0 0 1-1.6-1.6V2.8A1.6 1.6 0 0 1 3 1.2z" fill="none" stroke="#1C1C1A" stroke-width="1.9"/>
    <path d="M15.4 1.2v9.4h9.4" fill="none" stroke="#1C1C1A" stroke-width="1.9"/>
    <rect x="4.6" y="19.6" width="16.4" height="9.4" fill="#1C1C1A"/>
    <text x="12.8" y="26.9" font-size="6.8" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Inter Tight, Inter, Arial, sans-serif">CSV</text>
  </symbol>
  <symbol id="ic-json" viewBox="0 0 28 34">
    <path d="M3 1.2h12.4l9.4 9.4v21.2a1.6 1.6 0 0 1-1.6 1.6H3a1.6 1.6 0 0 1-1.6-1.6V2.8A1.6 1.6 0 0 1 3 1.2z" fill="none" stroke="#1C1C1A" stroke-width="1.9"/>
    <path d="M15.4 1.2v9.4h9.4" fill="none" stroke="#1C1C1A" stroke-width="1.9"/>
    <text x="12.6" y="26.6" font-size="12" font-weight="600" fill="#1C1C1A" text-anchor="middle" font-family="Inter Tight, Inter, Arial, sans-serif">{ }</text>
  </symbol>

  <!-- One stored prefix. Tinted per row through the color property. -->
  <symbol id="ic-db" viewBox="0 0 38 34">
    <ellipse cx="19" cy="6.4" rx="16.8" ry="5.2" fill="none" stroke="currentColor" stroke-width="2.3"/>
    <path d="M2.2 6.4v21.2c0 2.9 7.5 5.2 16.8 5.2s16.8-2.3 16.8-5.2V6.4" fill="none" stroke="currentColor" stroke-width="2.3"/>
    <path d="M2.2 14.2c0 2.9 7.5 5.2 16.8 5.2s16.8-2.3 16.8-5.2" fill="none" stroke="currentColor" stroke-width="2.3"/>
    <path d="M2.2 21.4c0 2.9 7.5 5.2 16.8 5.2s16.8-2.3 16.8-5.2" fill="none" stroke="currentColor" stroke-width="2.3"/>
  </symbol>

  <!-- The six answers: a report with a clock, because they are read on a cadence. -->
  <symbol id="ic-report" viewBox="0 0 42 37">
    <rect x="1.4" y="1.4" width="30" height="26" rx="2.6" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
    <rect x="7" y="14.6" width="4" height="8" fill="#FFFFFF"/>
    <rect x="14" y="9.4" width="4" height="13.2" fill="#FFFFFF"/>
    <rect x="21" y="12.4" width="4" height="10.2" fill="#FFFFFF"/>
    <circle cx="31" cy="26.4" r="8.6" fill="#E8431E" stroke="#FFFFFF" stroke-width="2.4"/>
    <path d="M31 21.6v4.8l3.2 2" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>

  <!-- The query engine. -->
  <symbol id="ic-gear" viewBox="0 0 34 34">
    <g fill="#1C1C1A">
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1"/>
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1" transform="rotate(45 17 17)"/>
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1" transform="rotate(90 17 17)"/>
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1" transform="rotate(135 17 17)"/>
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1" transform="rotate(180 17 17)"/>
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1" transform="rotate(225 17 17)"/>
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1" transform="rotate(270 17 17)"/>
      <rect x="14.6" y="0.6" width="4.8" height="7.2" rx="1" transform="rotate(315 17 17)"/>
    </g>
    <circle cx="17" cy="17" r="10.4" fill="none" stroke="#1C1C1A" stroke-width="3"/>
    <circle cx="17" cy="17" r="3.6" fill="none" stroke="#1C1C1A" stroke-width="3"/>
  </symbol>
</defs>

<rect width="1120" height="532" fill="#FFFFFF"/>

<!-- HEADER ================================================================ -->
<text x="34" y="28" font-size="22" fill="#1C1C1A">
  <tspan font-weight="700" letter-spacing=".4">TERRAFORM</tspan><tspan fill="#C9C6BE" font-weight="300">&#160;&#160;|&#160;&#160;</tspan><tspan font-weight="600">Infrastructure as Code</tspan>
</text>
<text x="35" y="48" font-size="12.5" fill="#56534D">Provisions everything: S3 · Glue Data Catalog · IAM · Budgets · SNS · CloudWatch</text>

<!-- SOURCES =============================================================== -->
<text x="35" y="86" font-size="10.5" font-weight="600" letter-spacing="2" fill="#8A8780">SOURCES</text>

<use href="#ic-csv" x="40" y="98" width="28" height="34"/>
<text x="90" y="118" font-size="13.5" font-weight="600" fill="#1C1C1A">orders.csv</text>
<text x="90" y="136" font-size="11.5" fill="#56534D">CSV · 7,956 rows</text>

<use href="#ic-json" x="40" y="171" width="28" height="34"/>
<text x="90" y="191" font-size="13.5" font-weight="600" fill="#1C1C1A">products.jsonl</text>
<text x="90" y="209" font-size="11.5" fill="#56534D">NDJSON · 130</text>

<use href="#ic-json" x="40" y="239" width="28" height="34"/>
<text x="90" y="259" font-size="13.5" font-weight="600" fill="#1C1C1A">users.jsonl</text>
<text x="90" y="277" font-size="11.5" fill="#56534D">NDJSON · 130</text>

<text x="35" y="308" font-size="11" fill="#56534D">partitioned on</text>
<text x="35" y="323" font-size="11" fill="#56534D">ingestion date</text>

<!-- the three sources merge into one trunk before landing in bronze -->
<path d="M205 115H218M205 188H218M205 256H218M218 115V256" fill="none" stroke="#1C1C1A" stroke-width="1.6"/>
<line x1="218" y1="188" x2="270" y2="188" stroke="#1C1C1A" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- S3 ==================================================================== -->
<rect x="276" y="64" width="552" height="357" fill="#FCFBF8" stroke="#C9C6BE" stroke-width="1.4"/>
<text x="296" y="86" font-size="11" letter-spacing="1.1" fill="#56534D">
  <tspan font-weight="700" fill="#1C1C1A">AMAZON S3</tspan><tspan>&#160;&#160;·&#160;&#160;ONE BUCKET, FOUR PREFIXES</tspan>
</text>

<!-- bronze -->
<rect x="296" y="94" width="513" height="61" fill="#FBF2E4"/>
<use href="#ic-db" x="320" y="108" width="38" height="34" color="#B85A0B"/>
<text x="391" y="116" font-size="17" font-weight="700" fill="#B85A0B">bronze/</text>
<text x="391" y="133" font-size="12.5" fill="#2C2A26">raw · immutable · faithful to the source</text>
<text x="391" y="149" font-size="11.5" fill="#6E6B65">7,956 rows · CSV + NDJSON</text>

<line x1="560" y1="157" x2="560" y2="187" stroke="#1C1C1A" stroke-width="1.7" marker-end="url(#ar)"/>
<text x="578" y="170" font-size="11.5" fill="#1C1C1A">Athena CTAS</text>
<text x="578" y="185" font-size="11" fill="#56534D">clean · type · deduplicate</text>

<!-- silver -->
<rect x="296" y="191" width="513" height="60" fill="#EDEBE5"/>
<use href="#ic-db" x="320" y="204" width="38" height="34" color="#56534D"/>
<text x="391" y="213" font-size="17" font-weight="700" fill="#3A3833">silver/</text>
<text x="391" y="230" font-size="12.5" fill="#2C2A26">cleaned · typed · deduplicated</text>
<text x="391" y="246" font-size="11.5" fill="#6E6B65">Parquet Snappy · 7,547 rows · 4 partitions</text>

<line x1="560" y1="253" x2="560" y2="286" stroke="#1C1C1A" stroke-width="1.7" marker-end="url(#ar)"/>
<text x="578" y="266" font-size="11.5" fill="#1C1C1A">Athena CTAS</text>
<text x="578" y="281" font-size="11" fill="#56534D">dimensional modelling</text>

<!-- gold -->
<rect x="296" y="290" width="513" height="61" fill="#FCF4E2"/>
<use href="#ic-db" x="320" y="304" width="38" height="34" color="#B8901A"/>
<text x="391" y="312" font-size="17" font-weight="700" fill="#8C6D08">gold/</text>
<text x="391" y="329" font-size="12.5" fill="#2C2A26">star schema</text>
<text x="391" y="345" font-size="11.5" fill="#6E6B65">7,547 facts + 354 dimension rows</text>

<!-- athena-results -->
<rect x="296" y="364" width="513" height="45" fill="#FFFFFF"/>
<use href="#ic-db" x="324" y="373" width="30" height="27" color="#8A8780"/>
<text x="391" y="382" font-size="13.5" font-weight="600" fill="#56534D">athena-results/</text>
<text x="391" y="399" font-size="11.5" fill="#8A8780">query output</text>

<!-- SIX BUSINESS ANSWERS ================================================== -->
<line x1="812" y1="320" x2="864" y2="320" stroke="#E8431E" stroke-width="2" marker-end="url(#aro)"/>
<rect x="864" y="249" width="242" height="143" fill="#E8431E"/>
<use href="#ic-report" x="884" y="263" width="42" height="37"/>
<text x="938" y="277" font-size="12" font-weight="700" letter-spacing=".2" fill="#FFFFFF">6 BUSINESS ANSWERS</text>
<text x="938" y="297" font-size="11.5" fill="#FBDDD4">revenue by country</text>
<text x="938" y="313" font-size="11.5" fill="#FBDDD4">top products</text>
<text x="938" y="329" font-size="11.5" fill="#FBDDD4">monthly trend</text>
<text x="938" y="345" font-size="11.5" fill="#FBDDD4">average basket</text>
<text x="938" y="361" font-size="11.5" fill="#FBDDD4">top customers</text>
<text x="938" y="377" font-size="11.5" fill="#FBDDD4">orphan keys</text>

<!-- CATALOG AND QUERY ENGINE ============================================== -->
<line x1="344" y1="443" x2="344" y2="424" stroke="#56534D" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="364" y="437" font-size="11" fill="#56534D">where, what schema, what format</text>
<line x1="752" y1="443" x2="752" y2="424" stroke="#56534D" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="772" y="437" font-size="11" fill="#56534D">reads, transforms, writes</text>

<rect x="139" y="447" width="358" height="73" fill="#F3F1EC" stroke="#C9C6BE" stroke-width="1.2"/>
<use href="#ic-db" x="160" y="470" width="32" height="29" color="#1C1C1A"/>
<text x="207" y="472" font-size="13" font-weight="700" letter-spacing=".4" fill="#1C1C1A">GLUE DATA CATALOG</text>
<text x="207" y="491" font-size="11.5" fill="#56534D">schemas, formats, partitions</text>
<text x="207" y="506" font-size="11.5" fill="#56534D">no data, metadata only</text>

<rect x="614" y="447" width="360" height="73" fill="#F3F1EC" stroke="#C9C6BE" stroke-width="1.2"/>
<use href="#ic-gear" x="636" y="468" width="32" height="32"/>
<text x="698" y="469" font-size="13" font-weight="700" letter-spacing=".4" fill="#1C1C1A">ATHENA</text>
<text x="698" y="485" font-size="11.5" fill="#56534D">workgroup primary</text>
<text x="698" y="499" font-size="11.5" fill="#56534D">serverless SQL engine (Trino)</text>
<text x="698" y="513" font-size="11.5" fill="#56534D">$5 per TB scanned</text>
</svg>
