name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff

      - name: init
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: validate
        run: terraform -chdir=terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4

      - run: tflint --chdir=terraform --format compact

  shell:
    name: shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck scripts/*.sh

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4    # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -m "not aws" -q

  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Gold layer
        run: |
          if sed 's/--.*//' sql/04_gold.sql | grep -ni '_raw'; then
            echo "::error file=sql/04_gold.sql::gold references a bronze table"
            exit 1
          fi

      - name: SQL anti-join
        run: |
          for f in sql/*.sql; do
            if sed 's/--.*//' "$f" | grep -niE '\bNOT +IN *\('; then
              echo "::error file=$f::use LEFT JOIN ... IS NULL, not NOT IN"
              exit 1
            fi
          done

      - name: Secrets and account IDs
        run: |
          if git grep -nE 'AKIA[0-9A-Z]{16}'; then
            echo "::error::an AWS access key id is committed"
            exit 1
          fi

          if git grep -nE '(^|[^0-9])[0-9]{12}([^0-9]|$)' -- '*.tf' '*.sql' | grep -vF '123456789012'; then
            echo "::error::a hard-coded AWS account id is committed"
            exit 1
          fi

          if git ls-files --error-unmatch terraform/terraform.tfvars >/dev/null 2>&1; then
            echo "::error::terraform.tfvars is committed"
            exit 1
          fi
