# ===========================================================================
# e2e.yml — deploys to a real AWS account, runs the pipeline, destroys it.
# ===========================================================================
# Weekly on Monday, plus on demand. Not on every push: it costs a few cents and
# a few minutes, and nothing in a typical commit can change what it proves.
#
# What it proves that ci.yml cannot: that the SQL actually runs on Athena, that
# the IAM policy is sufficient AND minimal, that the numbers this repository
# claims are still the numbers the pipeline produces, and that destroy is clean.
#
# NO LONG-LIVED KEYS. Authentication is OIDC: GitHub presents a signed token,
# AWS exchanges it for a 1-hour session. There is no secret in this repository
# that would still work if it leaked tomorrow.
#
# Required repository variables (Settings > Secrets and variables > Actions):
#   AWS_ROLE_ARN        the role GitHub assumes (see README for the snippet)
#   AWS_REGION          us-east-1
#   BUDGET_ALERT_EMAIL  where the budget alarm goes
# ===========================================================================

name: e2e

on:
  schedule:
    - cron: "0 6 * * 1"     # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  id-token: write           # required to request the OIDC token
  contents: read

concurrency:
  # Two runs would fight over the same bucket name and the same Glue database.
  group: e2e
  cancel-in-progress: false

jobs:
  end-to-end:
    name: deploy → pipeline → assert → destroy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4
      - name: debug oidc claims
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({k: claims.get(k) for k in ("iss", "aud", "sub")}, indent=2))
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: e2e-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r tests/requirements.txt

      # ---------------------------------------------------------------------
      - name: deploy
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform apply -auto-approve -input=false

      # run_pipeline.sh detects that it is already running under an assumed
      # role and skips its own assume-role. Same script as on a laptop.
      - name: run the pipeline
        run: ./scripts/run_pipeline.sh all

      - name: run the analytics queries
        run: ./scripts/run_pipeline.sh analytics

      # The assertions that need a deployed lake: row counts, revenue, the six
      # invariants, and the exact cost of the INNER JOIN trap.
      - name: assert the invariants
        run: pytest -m aws -q

      # ---------------------------------------------------------------------
      - name: collect evidence
        if: always()
        run: |
          mkdir -p .out
          terraform -chdir=terraform output -json > .out/outputs.json 2>/dev/null || true
          BUCKET=$(jq -r '.bucket_name.value // empty' .out/outputs.json)
          if [ -n "$BUCKET" ]; then
            aws s3 ls "s3://$BUCKET" --recursive --summarize > .out/s3-listing.txt || true
          fi
          aws sts get-caller-identity > .out/identity.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: .out/
          retention-days: 14

      # if: always() is the point of this job. A failed assertion must still
      # tear the infrastructure down — otherwise a red build leaves a bucket
      # and a Glue database billing quietly until someone notices.
      - name: destroy
        if: always()
        run: terraform -chdir=terraform destroy -auto-approve -input=false

      - name: confirm nothing is left
        if: always()
        run: |
          COUNT=$(terraform -chdir=terraform state list 2>/dev/null | wc -l)
          echo "resources still in state: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "::error::destroy left $COUNT resources"; exit 1; }
