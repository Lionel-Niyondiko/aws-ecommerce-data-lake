[project]
name = "aws-ecommerce-data-lake"
version = "0.1.0"
description = "AWS E-commerce Data Lake"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "aws: tests requiring a deployed AWS data lake",
]

# ---------------------------------------------------------------------------
# Ruff: Python lint (`ruff check`) and formatting (`ruff format`).
# Two separate jobs: the linter finds likely bugs and outdated idioms, the
# formatter only rewrites layout. Run both through Taskfile:
#   task lint              ruff check .
#   task fmt-python        ruff format .
#   task fmt-python-check  ruff format --check .
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes: undefined names, unused imports and variables
    "I",   # isort: import order
    "B",   # flake8-bugbear: likely bugs and design problems
    "UP",  # pyupgrade: idioms for the targeted Python version
    "PT",  # flake8-pytest-style: pytest conventions in tests/
]
ignore = [
    "E501",  # line length is the formatter's job; long SQL and report strings stay readable
]
